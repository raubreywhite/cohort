on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

name: Check and pkgdown

jobs:
  r-package:
    permissions:
      contents: write
    uses: raubreywhite/rwtemplate/.github/workflows/r-package.yml@d8ac8295e20f72700129d27ed38e5f55ae1b6a34
    with:
      # cyclocomp_linter: the R6Class() call is one expression, so its
      # complexity is the sum over all methods. Splitting the class is a
      # separate change.
      # undesirable_function_linter: the cache file format is RDS, so
      # $new() reads it with readRDS() and $save() writes it with saveRDS().
      # A change to qs2 invalidates every existing cache file.
      lint-allowlist: |
        R/cohort_pipeline.R:cyclocomp_linter
        R/cohort_pipeline.R:undesirable_function_linter
