url: https://www.rwhite.no/cohort/

template:
  bootstrap: 5
  bslib:
    heading_font: { google: "Newsreader" }
    code_font:    { google: "IBM Plex Mono" }
    primary: "#8a1c1c"
    bg: "#ffffff"
    fg: "#231c16"
    link-color: "#8a1c1c"
    border-radius: "0.15rem"
  includes:
    in_header: >
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

navbar:
  bg: dark
  type: dark
  structure:
    left:  [reference, articles]
    right: [search, github]

reference:
- title: "Cohort Construction"
  desc: "The CohortPipeline R6 class — the main entry point of the package."
  contents:
    - CohortPipeline

authors:
  footer:
    roles: [cre, aut]
    text: "Crafted by"
  sidebar:
    roles: [cre, aut, cph]
  Richard Aubrey White:
    href: "https://www.rwhite.no"
